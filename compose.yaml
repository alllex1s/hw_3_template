services:
  app:
    build: .
    user: "10001:10001"
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    environment:
      GREETING: "${GREETING:-привет из compose}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          from urllib.request import urlopen
          urlopen("http://127.0.0.1:8000/readyz", timeout=2).close()
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
